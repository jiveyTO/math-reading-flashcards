<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flashcard Stats Dashboard</title>
  <!-- Firebase App (core) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <!-- Firestore -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <h2 id="dashboard-title">Flashcard Performance Dashboard</h2>
  <div id="stats" style="font-family: sans-serif; padding: 1em;"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getFirestore, collection, getDocs, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
  import {
    getAuth,
    signInWithPopup,
    GoogleAuthProvider,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFhwBCyr6yXLvNONf3dQUv8LGg8Un36zc",
    authDomain: "flash-cards-b3a3f.firebaseapp.com",
    databaseURL: "https://flash-cards-b3a3f-default-rtdb.firebaseio.com",
    projectId: "flash-cards-b3a3f",
    storageBucket: "flash-cards-b3a3f.firebasestorage.app",
    messagingSenderId: "709645186952",
    appId: "1:709645186952:web:7e00a3392de9a0d4c4ec3d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const isDev = location.hostname === "localhost";
  document.getElementById("dashboard-title").textContent =
    isDev ? "Flashcard Performance Dashboard - Dev Stats" : "Flashcard Performance Dashboard";
  const collectionPrefix = isDev ? "dev_stats" : "stats";

  function loadStats(user) {
    console.log("✅ User:", user.displayName);
    const statsContainer = document.getElementById('stats');
    statsContainer.innerHTML = `<p>✅ Signed in as: ${user.displayName}</p>`;

    (async () => {
      try {
        const statsSnap = await getDocs(collection(db, collectionPrefix));
        console.log("📊 statsSnap size:", statsSnap.size);

        if (statsSnap.size === 0) {
          const row = document.createElement('div');
          row.textContent = "No stats found in Firestore.";
          statsContainer.appendChild(row);
          return;
        }

        const statData = [];

        for (const statDoc of statsSnap.docs) {
          const question = decodeURIComponent(statDoc.id);
          const answersSnap = await getDocs(collection(db, `${collectionPrefix}/${statDoc.id}/answers`));
          const total = answersSnap.size;
          const right = answersSnap.docs.filter(d => d.data().result === "right").length;
          const accuracy = total > 0 ? Math.round((right / total) * 100) : 100;

          statData.push({ question, right, total, accuracy });
        }

        const filtered = statData.filter(d => d.accuracy < 95).sort((a, b) => a.accuracy - b.accuracy);

        if (filtered.length === 0) {
          const row = document.createElement('div');
          row.textContent = "🎉 No low-performing cards! All questions are above 50%.";
          statsContainer.appendChild(row);
        } else {
          const table = document.createElement('table');
          table.style.borderCollapse = 'collapse';
          table.style.marginTop = '1em';
          statsContainer.appendChild(table);

          const header = document.createElement('tr');
          ['Question', 'Right', 'Total', 'Accuracy'].forEach(text => {
            const th = document.createElement('th');
            th.textContent = text;
            th.style.border = '1px solid #ccc';
            th.style.padding = '4px 8px';
            th.style.backgroundColor = '#f0f0f0';
            header.appendChild(th);
          });
          table.appendChild(header);

          for (const d of filtered) {
            const row = document.createElement('tr');
            [d.question, d.right, d.total, `${d.accuracy}%`].forEach(val => {
              const td = document.createElement('td');
              td.textContent = val;
              td.style.border = '1px solid #ccc';
              td.style.padding = '4px 8px';
              row.appendChild(td);
            });
            table.appendChild(row);
          }
        }
      } catch (error) {
        console.error("🔥 Firestore error:", error);
        statsContainer.innerHTML += `<p style="color:red">🔥 Firestore error: ${error.message}</p>`;
      }
    })();
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      loadStats(user);
    } else {
      signInWithPopup(auth, provider)
        .then(result => {
          loadStats(result.user);
        })
        .catch(error => {
          console.error("❌ Sign-in failed:", error);
          document.getElementById('stats').textContent = "❌ Sign-in failed.";
        });
    }
  });
</script>
</body>
</html>
