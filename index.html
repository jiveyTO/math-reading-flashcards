<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math & Reading Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }
        .card {
            background-color: #fff;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .question {
            font-size: 1.5em;
            margin-bottom: 1em;
        }
        button {
            padding: 0.5em 1em;
            font-size: 1em;
            margin-top: 1em;
            cursor: pointer;
        }
    </style>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
      import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
      import { getFirestore, collection, addDoc, setDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
      import { getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
      import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBFhwBCyr6yXLvNONf3dQUv8LGg8Un36zc",
        authDomain: "flash-cards-b3a3f.firebaseapp.com",
        databaseURL: "https://flash-cards-b3a3f-default-rtdb.firebaseio.com",
        projectId: "flash-cards-b3a3f",
        storageBucket: "flash-cards-b3a3f.firebasestorage.app",
        messagingSenderId: "709645186952",
        appId: "1:709645186952:web:7e00a3392de9a0d4c4ec3d"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      // Removed automatic sign-in

      const db = getDatabase(app);
      const firestore = getFirestore(app);
      // DEV/PROD collection prefix logic
      const isDev = location.hostname === "localhost";
      const collectionPrefix = isDev ? "dev_stats" : "stats";
      window.collectionPrefix = collectionPrefix;
      window.firebaseDb = db;
      window.firebaseRef = ref;
      window.firebasePush = push;
      window.firestore = firestore;
      window.firestoreCollection = collection;
      window.firestoreAddDoc = addDoc;
      window.firestoreSetDoc = setDoc;
      window.firestoreDoc = doc;
      window.firestoreGetDocs = getDocs;

      document.getElementById('signInButton').addEventListener('click', () => {
        signInWithPopup(auth, provider)
          .then((result) => {
            console.log("✅ Signed in as:", result.user.displayName);
            document.getElementById('signInContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            initializeWeights().then(() => nextQuestion());
          })
          .catch((error) => {
            console.error("❌ Sign-in failed:", error.message);
          });
      });
    </script>
</head>
<body>

<div id="signInContainer" style="text-align: center;">
  <button id="signInButton" style="background-color: #4285F4; color: white; padding: 0.5em 1em; font-size: 1em;">Sign in with Google</button>
</div>

<div id="appContainer" style="display: none;">

<div class="card">
    <div id="questionCard">
        <div class="question" id="question">Loading...</div>
        <button id="rightButton" style="background-color: #4CAF50; color: white; margin-right: 1em;">Right</button>
        <button id="wrongButton" style="background-color: #f44336; color: white;">Wrong</button>
        <button id="restartButton" style="display: none; background-color: #2196F3; color: white; margin-top: 1em;">Restart</button>
    </div>

    <div id="prizeCard">
        <div style="font-size: 1.5em;">🎉 Congrats! You got 10 right! 🎉</div>
        <div>
            <img src="images/minecraft_prize_pickaxe.png" alt="Pickaxe Prize" style="width: 80px; height: 80px; margin-top: 15px;">
        </div>
        <button id="continueButton" style="background-color: #4CAF50; color: white;">Continue</button>
    </div>
    
    <div style="margin-top: 1em; text-align: center;">
        <div id="score" style="font-size: 1em;">Score: 0</div>
        <div id="cardStats" style="height: 24px; margin-top: 4px;"></div>
    </div>    
</div>

</div>

<script>
    let currentQuestion = null;

    function calculateWeight(pct) {
      if (pct === null) return 100;
      if (pct < 50) {
        return 50 + ((50 - pct) / 50) * 25;
      } else if (pct < 80) {
        return 25 + ((80 - pct) / 30) * 15;
      } else {
        return 5 + ((100 - pct) / 20) * 20;
      }
    }

    function renderMinecraftRating(pct) {
        const container = document.getElementById('cardStats');
        container.style.display = 'flex';
        container.style.justifyContent = 'center';
        container.innerHTML = '';

        const barWidth = 100; // Width of the bar in px
        const sliderWidth = 4; // Width of the slider in px

        const bar = document.createElement('div');
        bar.style.width = `${barWidth}px`;
        bar.style.height = '12px';
        bar.style.background = 'linear-gradient(to right, orange, yellow, #0080FF, #00FF00)';
        bar.style.position = 'relative';
        bar.style.borderRadius = '6px'; // Rounded corners
        container.appendChild(bar);

        const slider = document.createElement('div');
        slider.style.width = `${sliderWidth}px`;
        slider.style.height = '16px';
        slider.style.backgroundColor = 'black';
        slider.style.left = `${(pct / 100) * barWidth - sliderWidth / 2}px`;
        slider.style.top = '-2px'; // To align with bar
        slider.style.position = 'absolute';
        bar.appendChild(slider);
    }

    // Global questions array and initializeWeights function
    let questions = [];
    let initializeWeights;

    // Move initializeWeights to top-level and use global questions variable
    initializeWeights = async function () {
      for (const q of questions) {
        const firestoreStatsSnap = await window.firestoreGetDocs(
          window.firestoreCollection(window.firestore, collectionPrefix, encodeURIComponent(q), "answers")
        );

        let right = 0;
        let total = 0;
        firestoreStatsSnap.forEach(doc => {
          total++;
          if (doc.data().result === "right") right++;
        });

        let pct = total > 0 ? (right / total) * 100 : null;
        let weight = calculateWeight(pct);

        console.log(`Weight for "${q}": ${weight.toFixed(2)} (pct=${pct !== null ? pct.toFixed(2) : 'null'}, right=${right}, total=${total})`);
        window.questionWeights.push({ question: q, weight, right, total });
      }
    };

    fetch('questions.json')
        .then(response => response.json())
        .then(data => {
            questions = data.questions;
            let score = 0;
            let prizeCounter = 0;

            window.questionWeights = [];

            async function nextQuestion() {
                if (window.questionWeights.length === 0) {
                  await initializeWeights();
                }
                if (questions.length > 0) {
                    if (prizeCounter >= 10) {
                        document.getElementById('question').style.display = 'none';
                        document.getElementById('cardStats').style.display = 'none';
                        document.getElementById('rightButton').style.display = 'none';
                        document.getElementById('wrongButton').style.display = 'none';
                        document.getElementById('prizeCard').style.display = 'block';
                        prizeCounter = 0;
                        return;
                    }
                    const totalWeight = window.questionWeights.reduce((sum, q) => sum + q.weight, 0);
                    const rand = Math.random() * totalWeight;
                    let cumulative = 0;
                    let chosen = null;

                    for (const q of window.questionWeights) {
                      cumulative += q.weight;
                      if (rand < cumulative) {
                        chosen = q.question;
                        break;
                      }
                    }

                    const question = chosen;
                    console.log(`Chosen question: "${question}" with weight: ${window.questionWeights.find(q => q.question === question)?.weight}`);


                    document.getElementById('question').innerText = question;
                    const chosenStats = window.questionWeights.find(q => q.question === question);
                    let right = chosenStats.right || 0;
                    let total = chosenStats.total || 0;
                    const pct = total > 0 ? Math.round((right / total) * 100) : 0;
                    console.log(`Firestore stats for "${question}": ${right} right out of ${total}`);
                    renderMinecraftRating(pct);
                    currentQuestion = question;
                } else {
                    document.getElementById('question').innerText = 'Great job! You finished!';
                    document.getElementById('cardStats').innerText = '';
                    document.getElementById('rightButton').style.display = 'none';
                    document.getElementById('wrongButton').style.display = 'none';
                    document.getElementById('restartButton').style.display = 'inline-block';
                }
            }

            // Make it globally accessible to the button
            window.nextQuestion = nextQuestion;

            document.getElementById('rightButton').addEventListener('click', () => {
                if (currentQuestion) {
                    score++;
                    prizeCounter++;
                    console.log(`Prize Counter: ${prizeCounter}`);
                    document.getElementById('score').innerText = `Score: ${score}`;
                    firebasePush(firebaseRef(firebaseDb, 'stats/' + encodeURIComponent(currentQuestion)), {
                      date: new Date().toISOString(),
                      result: "right"
                    });
                    firestoreSetDoc(
                      firestoreDoc(firestore, collectionPrefix, encodeURIComponent(currentQuestion)),
                      { created: new Date().toISOString() },
                      { merge: true }
                    );
                    firestoreAddDoc(
                      firestoreCollection(firestore, collectionPrefix, encodeURIComponent(currentQuestion), "answers"),
                      {
                        date: new Date().toISOString(),
                        result: "right"
                      }
                    );
                    // Update local questionWeights immediately after adding doc
                    const qIndex = window.questionWeights.findIndex(q => q.question === currentQuestion);
                    if (qIndex !== -1) {
                      window.questionWeights[qIndex].right += 1;
                      window.questionWeights[qIndex].total += 1;
                      const newPct = (window.questionWeights[qIndex].right / window.questionWeights[qIndex].total) * 100;
                      let newWeight = 0;
                      newWeight = calculateWeight(newPct);
                      window.questionWeights[qIndex].weight = newWeight;
                      console.log(`Updated weight for "${currentQuestion}": ${newWeight.toFixed(2)} (pct=${newPct.toFixed(2)}, right=${window.questionWeights[qIndex].right}, total=${window.questionWeights[qIndex].total})`);
                    }
                }
                nextQuestion();
            });

            document.getElementById('wrongButton').addEventListener('click', () => {
                if (currentQuestion) {
                    firebasePush(firebaseRef(firebaseDb, 'stats/' + encodeURIComponent(currentQuestion)), {
                      date: new Date().toISOString(),
                      result: "wrong"
                    });
                    firestoreSetDoc(
                      firestoreDoc(firestore, collectionPrefix, encodeURIComponent(currentQuestion)),
                      { created: new Date().toISOString() },
                      { merge: true }
                    );
                    firestoreAddDoc(
                      firestoreCollection(firestore, collectionPrefix, encodeURIComponent(currentQuestion), "answers"),
                      {
                        date: new Date().toISOString(),
                        result: "wrong"
                      }
                    );
                    // Update local questionWeights after adding doc
                    const qIndex = window.questionWeights.findIndex(q => q.question === currentQuestion);
                    if (qIndex !== -1) {
                      window.questionWeights[qIndex].total += 1;
                      const newPct = (window.questionWeights[qIndex].right / window.questionWeights[qIndex].total) * 100;
                      let newWeight = calculateWeight(newPct);
                      window.questionWeights[qIndex].weight = newWeight;
                      console.log(`Updated weight for "${currentQuestion}": ${newWeight.toFixed(2)} (pct=${newPct.toFixed(2)}, right=${window.questionWeights[qIndex].right}, total=${window.questionWeights[qIndex].total})`);
                    }
                }
                nextQuestion();
            });
            document.getElementById('restartButton').addEventListener('click', () => {
                location.reload();
            });

            document.getElementById('continueButton').addEventListener('click', () => {
                document.getElementById('prizeCard').style.display = 'none';
                document.getElementById('question').style.display = 'block';
                document.getElementById('cardStats').style.display = 'block';
                document.getElementById('rightButton').style.display = 'inline-block';
                document.getElementById('wrongButton').style.display = 'inline-block';
                nextQuestion();
            });

            // Ensure prize card is hidden on load
            document.getElementById('prizeCard').style.display = 'none';
            // Removed direct call to initializeWeights().then(() => nextQuestion());
        })
        .catch(error => {
            console.error('Error loading questions:', error);
            document.getElementById('question').innerText = 'Error loading questions.';
        });
</script>

</body>
</html>
